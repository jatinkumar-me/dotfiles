unbind r

# Bind Ctrl+r to reload tmux config
bind-key -n C-x source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Unbind default split keys
unbind %
unbind '"'

# Immediately close pane without prompt
unbind x
bind-key x kill-pane

# Bind 'v' to vertical split in the same directory
bind v split-window -h -c '#{pane_current_path}'

# Bind 'b' to horizontal split
bind b split-window -v -c '#{pane_current_path}'

# Set plugin manager

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# set -g @plugin 'erikw/tmux-powerline'

set-option -g status-position top
